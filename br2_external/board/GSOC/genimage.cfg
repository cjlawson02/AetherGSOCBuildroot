image boot.vfat {
	vfat {
		files = {
			"zImage",
			"sun7i-a20-xiegu-gsoc.dtb",
			"boot.scr"
		}
		extraargs = "-n 'GSOC-BOOT'"
	}
	size = 32M
}

# Whole card, laid out like the cards in use: the self-built U-Boot at 8 KiB
# (where the A20 boot ROM looks), GSOC-BOOT at 1 MiB, a 1 GiB rootfs partition
# at 33 MiB.  rootfs.ext4 is Buildroot's, used as is (no image section here).
image sdcard.img {
	hdimage {
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K # 1MB - 8KB
	}

	partition boot {
		partition-type = 0xc
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 1024M
	}
}
