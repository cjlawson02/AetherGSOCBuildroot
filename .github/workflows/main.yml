name: Build GSOC image
on:
  workflow_dispatch:
  push:
    # Pattern matched against refs/tags
    tags:
      - '*'           # Push events to every tag not containing /

jobs:
  build:
    runs-on: ubuntu-22.04
    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Cache ccache
      id: cache-ccache
      uses: actions/cache@v4
      with:
        path: ~/.buildroot-ccache
        key: ${{ runner.os }}-ccache

    # Configure
    - name: Configure
      run: bash ./br_config.sh

    # Build
    - name: Build
      run: |
        cd build && make

    # Collect payloads
    - name: Collect payloads
      run: |
        cd build/images
        zip gsoc-payloads.zip zImage sun7i-a20-xiegu-gsoc.dtb boot.scr boot.vfat rootfs.ext4

    # Upload payloads
    - name: 'Upload payloads'
      uses: actions/upload-artifact@v4
      with:
        name: gsoc-payloads
        path: build/images/gsoc-payloads.zip

    # Create release
    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: build/images/gsoc-payloads.zip
